<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131f" />
      <stop offset="50%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#03070b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.85" />
    </linearGradient>

    <!-- AH Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- Ambient Glow -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#glowGrad)" pointer-events="none" />

  <!-- Text "AH" -->
  <text 
    x="64" 
    y="72" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="52" 
    letter-spacing="-2.5" 
    fill="url(#textGrad)"
    filter="url(#dropShadow)"
  >AH</text>

  <!-- Subtitle "MEDIA" -->
  <text 
    x="64" 
    y="96" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="800" 
    font-size="14.5" 
    letter-spacing="5" 
    fill="#67e8f9" 
    opacity="0.92"
  >MEDIA</text>
</svg>
